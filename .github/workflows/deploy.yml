name: Deploy to VPS

# "push + publish": every push to these branches auto-deploys to the server.
on:
  push:
    branches: [main, feature/refer-earn-wallet]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  # QUEUE, don't cancel. Cancelling the GitHub job does NOT kill the deploy.sh
  # already running on the VPS over SSH, so a rapid second push used to start a
  # second deploy on top of the first — they collided on .git/index.lock and the
  # newer run died at `git checkout` in ~10s ("Another git process seems to be
  # running"). Queueing makes each push deploy in order; deploy.sh also takes a
  # server-side lock as a second line of defence.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            bash /var/www/digitalcarda/deploy.sh "${{ github.ref_name }}"
