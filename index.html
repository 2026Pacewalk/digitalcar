         Search Console verify the site by finding this code, so don't edit or
         wrap it. The server leaves it out of the page on every host but the
         live site (api/lib/tag-manager.ts); dev strips it in vite.config.ts. -->

    })(window,document,'script','dataLayer','GTM-PK44T5J9');</script>

    <meta name="description" content="Create stunning AI-powered digital business cards with QR codes, lead tracking, payment links, and analytics. Start your 30-day free trial." />
    <meta name="theme-color" content="#0F172A" />
    <!-- Installed-app behaviour: full-screen from the home screen, with its own
         name under the icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DigitalCarda" />

    <title>DigitalCarda — Digital Visiting Card &amp; Business Card Maker</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

      rel="stylesheet"
    />
    <!-- Font Awesome is NOT linked here: only the dashboard's social-link icons
         use it, so those components load it on demand (src/lib/fontAwesome.ts)
         instead of every page waiting on a render-blocking stylesheet. -->
    <!-- Scroll-reveal sections start transparent and fade in once JavaScript
         marks them visible. Public pages are now rendered on the server, so
         without JavaScript the text is in the page but would stay invisible. -->
    <noscript><style>.reveal,.reveal-stagger>*{opacity:1!important;transform:none!important}</style></noscript>
    <!-- Google Analytics 4. Only loads on the live domain, so local dev and
         preview builds don't pollute the reports. SPA route changes are counted
         by GA's enhanced measurement (browser history events). -->
    <script>
      (function () {
        var h = location.hostname;
        if (h !== "digitalcarda.in" && !h.endsWith(".digitalcarda.in")) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-ZQ76JQ5PY2";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-ZQ76JQ5PY2");
      })();
    </script>
