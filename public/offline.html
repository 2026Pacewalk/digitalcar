<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="robots" content="noindex" />
  <title>You're offline · DigitalCarda</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0F172A; color: #E2E8F0;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    main { max-width: 340px; }
    img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 18px 40px -16px rgba(0,0,0,.7); }
    h1 { margin: 22px 0 8px; font-size: 22px; color: #fff; letter-spacing: -0.01em; }
    p { margin: 0; font-size: 15px; line-height: 1.55; color: #94A3B8; }
    button {
      margin-top: 26px; width: 100%; height: 50px; border: 0; border-radius: 14px;
      background: #F7B31C; color: #0F172A; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    small { display: block; margin-top: 16px; font-size: 12px; color: #64748B; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/app-192.png" alt="DigitalCarda" />
    <h1>You're offline</h1>
    <p>Check your mobile data or Wi-Fi. Your card is still live for everyone else — this is only your connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Opens automatically once you're back online.</small>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
