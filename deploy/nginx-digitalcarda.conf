# nginx site config for digitalcarda.in → Node app on 127.0.0.1:3000
# Copy to /etc/nginx/sites-available/digitalcarda and symlink into sites-enabled.
# Cloudflare sits in front (proxied/orange-cloud), so public TLS is handled by CF.
#
# Cloudflare SSL modes:
#   • "Flexible"     → this HTTP :80 block is enough.
#   • "Full/Strict"  → also add a :443 server{} with a Cloudflare Origin Certificate
#                      (recommended). See DEPLOY.md.

# Restore the real visitor IP from Cloudflare's CF-Connecting-IP header.
# (Keep this list current from https://www.cloudflare.com/ips/ )
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name digitalcarda.in www.digitalcarda.in;

    client_max_body_size 25M;
    proxy_read_timeout 120s;

    # Gzip for the built assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
